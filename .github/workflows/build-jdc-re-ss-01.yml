name: Build JDCloud RE-SS-01 NSS + eBPF-capable Firmware

on:
  push:
    branches:
      - feat/jdc-re-ss-01-source-build
    paths:
      - ".github/workflows/build-jdc-re-ss-01.yml"
      - "configs/jdc-re-ss-01-nss-ebpf.config"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdc-re-ss-01-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          ref: feat/jdc-re-ss-01-source-build
          persist-credentials: false

      - name: Preserve device configuration
        run: |
          test -s "$GITHUB_WORKSPACE/configs/jdc-re-ss-01-nss-ebpf.config"
          mkdir -p "$RUNNER_TEMP/jdc-re-ss-01"
          cp "$GITHUB_WORKSPACE/configs/jdc-re-ss-01-nss-ebpf.config" "$RUNNER_TEMP/jdc-re-ss-01/device.config"
          sha256sum "$RUNNER_TEMP/jdc-re-ss-01/device.config"

      - name: Show runner resources
        run: |
          echo "CPU:"
          nproc
          lscpu
          echo "Memory:"
          free -h
          echo "Disk:"
          df -hT

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 4096
          temp-reserve-mb: 1000
          root-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack asciidoc autoconf automake autopoint bison build-essential \
            bzip2 bpftool ccache clang cmake cpio curl device-tree-compiler dwarves \
            flex gawk gcc-multilib g++-multilib gettext git gperf \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp-dev libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev \
            libreadline-dev libssl-dev libtool libxml-parser-perl libzstd-dev \
            lld llvm llvm-dev make mkisofs ninja-build p7zip-full patch \
            pkg-config python3 python3-dev python3-pip python3-ply \
            python3-pyelftools python3-setuptools qemu-utils re2c rsync \
            squashfs-tools subversion swig time unzip upx-ucl wget xsltproc \
            zlib1g-dev zstd file
          sudo apt-get clean
          df -hT

      - name: Clone LiBwrt NSS source
        env:
          SOURCE_BRANCH: 25.12-nss
        run: |
          git clone --depth 1 --single-branch --branch "$SOURCE_BRANCH" \
            https://github.com/LiBwrt/LibWrt.git openwrt
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"
          cd openwrt
          git log -1 --format='LibWrt commit: %H%nCommit date: %cI%nSubject: %s'

      - name: Add HomeProxy package source
        run: |
          cd "$OPENWRT_PATH"
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git \
            package/luci-app-homeproxy
          test -f package/luci-app-homeproxy/Makefile

      - name: Install feeds and load device configuration
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp "$RUNNER_TEMP/jdc-re-ss-01/device.config" .config
          make defconfig
          echo "Resolved target:"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|qualcommax)' .config || true
          echo "Resolved required packages:"
          grep -E '^CONFIG_PACKAGE_(mwan3|luci-app-mwan3|adguardhome|luci-app-homeproxy)=y
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y$' .config
          grep -q '^CONFIG_PACKAGE_mwan3=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-mwan3=y$' .config
          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config
          ! grep -q '^CONFIG_PACKAGE_\(dae\|honk\|luci-app-dae\|luci-app-honk\)=y$' .config
          cp .config "$GITHUB_WORKSPACE/resolved.config"

      - name: Download source packages
        run: |
          cd "$OPENWRT_PATH"
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: Compile firmware
        run: |
          set +e
          cd "$OPENWRT_PATH"
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          echo "Starting parallel source build with $(nproc) jobs"
          make -j"$(nproc)" > "$GITHUB_WORKSPACE/build-logs/parallel.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Parallel build failed with exit code $rc; retrying serial verbose build"
            tail -n 120 "$GITHUB_WORKSPACE/build-logs/parallel.log"
            make -j1 V=s > "$GITHUB_WORKSPACE/build-logs/serial.log" 2>&1
            rc=$?
            echo "Serial build exit code: $rc"
            tail -n 300 "$GITHUB_WORKSPACE/build-logs/serial.log"
          fi
          exit "$rc"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-RE-SS-01-build-logs-${{ github.run_number }}
          if-no-files-found: warn
          compression-level: 6
          path: build-logs/

      - name: Verify target images and BTF configuration
        run: |
          cd "$OPENWRT_PATH"
          OUT="$OPENWRT_PATH/bin/targets/qualcommax/ipq60xx"
          test -d "$OUT"
          test -s "$OUT/profiles.json"
          grep -q 'jdcloud_re-ss-01' "$OUT/profiles.json"
          echo "Generated image files:"
          find "$OUT" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort
          echo "Kernel BTF setting:"
          find build_dir/target-* -path '*/linux-*/.config' -type f -print0 \\
            | xargs -0 -r grep -H '^CONFIG_DEBUG_INFO_BTF=y$' || true
          echo "Checksums:"
          (cd "$OUT" && sha256sum -c sha256sums)

      - name: Upload firmware and package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-RE-SS-01-LibWrt-NSS-eBPF-ready-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 1
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/
            openwrt/bin/packages/aarch64_cortex-a53/
            resolved.config
 .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y$' .config
          grep -q '^CONFIG_PACKAGE_mwan3=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-mwan3=y$' .config
          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config
          grep -q '^CONFIG_PACKAGE_vmlinux-btf-builtin=y$' .config
          ! grep -q '^CONFIG_PACKAGE_\(dae\|honk\|luci-app-dae\|luci-app-honk\)=y$' .config
          cp .config "$GITHUB_WORKSPACE/resolved.config"

      - name: Download source packages
        run: |
          cd "$OPENWRT_PATH"
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: Compile firmware
        run: |
          set +e
          cd "$OPENWRT_PATH"
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          echo "Starting parallel source build with $(nproc) jobs"
          make -j"$(nproc)" > "$GITHUB_WORKSPACE/build-logs/parallel.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Parallel build failed with exit code $rc; retrying serial verbose build"
            tail -n 120 "$GITHUB_WORKSPACE/build-logs/parallel.log"
            make -j1 V=s > "$GITHUB_WORKSPACE/build-logs/serial.log" 2>&1
            rc=$?
            echo "Serial build exit code: $rc"
            tail -n 300 "$GITHUB_WORKSPACE/build-logs/serial.log"
          fi
          exit "$rc"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-RE-SS-01-build-logs-${{ github.run_number }}
          if-no-files-found: warn
          compression-level: 6
          path: build-logs/

      - name: Verify target images and BTF configuration
        run: |
          cd "$OPENWRT_PATH"
          OUT="$OPENWRT_PATH/bin/targets/qualcommax/ipq60xx"
          test -d "$OUT"
          test -s "$OUT/profiles.json"
          grep -q 'jdcloud_re-ss-01' "$OUT/profiles.json"
          echo "Generated image files:"
          find "$OUT" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort
          echo "Kernel BTF setting:"
          find build_dir/target-* -path '*/linux-*/.config' -type f -print0 \\
            | xargs -0 -r grep -H '^CONFIG_DEBUG_INFO_BTF=y$' || true
          echo "Checksums:"
          (cd "$OUT" && sha256sum -c sha256sums)

      - name: Upload firmware and package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-RE-SS-01-LibWrt-NSS-eBPF-ready-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 1
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/
            openwrt/bin/packages/aarch64_cortex-a53/
            resolved.config
